<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- iPhone/iPad: o Safari dá zoom sozinho ao tocar num campo com fonte
         menor que 16px e não desfaz o zoom depois — a página fica "solta",
         arrastando pros lados. maximum-scale=1 desliga só esse zoom
         automático; o zoom com dois dedos continua funcionando no iOS (o
         Safari ignora essa trava pra gesto do usuário desde o iOS 10). Só no
         iOS: no Android a mesma trava bloquearia o zoom com os dedos. -->
    <script>
      (function () {
        var ua = navigator.userAgent || "";
        var isIOS = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        if (!isIOS) return;
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta) meta.setAttribute("content", "width=device-width, initial-scale=1.0, maximum-scale=1.0");
      })();
    </script>
    <!-- Evita que o Chrome ofereça/ative tradução automática — quando isso
         acontece durante o carregamento, a extensão mexe no HTML por fora do
         React e causa erros de "removeChild" na hora de re-renderizar. -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- iOS "Adicionar à Tela de Início" não usa o favicon comum — sem um
         apple-touch-icon dedicado, ele tira um print da página e usa isso
         como ícone. -->
    <link rel="apple-touch-icon" href="/vetflow-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VetFlow" />
    <!-- Inter: mesma família usada nos PDFs, servida localmente de
         /fonts/Inter-*.ttf. Declarada aqui para o editor de documentos
         exibir a fonte real do documento impresso (WYSIWYG), sem depender
         de CDN externo. -->
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('/fonts/Inter-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Inter';
        src: url('/fonts/Inter-Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Inter';
        src: url('/fonts/Inter-Italic.ttf') format('truetype');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Inter';
        src: url('/fonts/Inter-BoldItalic.ttf') format('truetype');
        font-weight: 700;
        font-style: italic;
        font-display: swap;
      }
    </style>
    <title>VetFlow - Gestão Veterinária</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
